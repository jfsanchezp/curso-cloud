spring.application.name=umufly-api

#### Base de datos
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
#spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@hydra-prescan.atica.um.es:1526/ZEUSTEST
spring.datasource.username=FORMACION_TICARUM
spring.datasource.password=

spring.datasource.hikari.maximum-pool-size=20
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle10gDialect
spring.jpa.generate-ddl=false


### Logs para ver si reconoce las tablas 
spring.jpa.hibernate.ddl-auto=validate
logging.level.org.hibernate.orm.boot=TRACE

### REST evitar que se ordenen los JSON alfabeticamente
spring.jackson.mapper.sort-properties-alphabetically=false

